name: Validate Action sandbox runner

on:
  push:
    branches: [validation/upstream-0.6.0-runner]

permissions:
  contents: read
  actions: read

jobs:
  workflow-quality:
    uses: ./.github/workflows/workflow-quality.yml
  action-compatibility:
    name: Action compatibility / ubuntu-24.04 / node-24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the runner fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1b4e19658de7e9a3cd68e9d484bc8cccad9fd447
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download the unchanged release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-40162513670fe9f77f55e1bd4f553050bd18c81e
          path: dist
          repository: opaloinfo9/codex-security
          run-id: 39892603964
          github-token: ${{ github.token }}
      - name: Verify the installed package
        working-directory: sdk/typescript
        run: node scripts/check-package.mjs ../../dist/*.tgz
      - name: Verify Action sandbox compatibility
        uses: ./.github/actions/check-action-candidate
